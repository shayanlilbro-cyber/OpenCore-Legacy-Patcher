name: Build OpenCore Legacy Patcher (Tahoe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List repository files
        run: |
          ls -R

      - name: Run build script
        run: |
          chmod +x Build-Project.command
          ./Build-Project.command

      - name: Create dist folder
        run: mkdir -p dist

      - name: Collect build output
        run: |
          cp -R *.app dist/ 2>/dev/null || true
          cp -R payloads dist/ 2>/dev/null || true
          cp -R build dist/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCLP-Tahoe-Build
          path: dist/
